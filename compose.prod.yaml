services:
  web:
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /app/data/db.sqlite3
    volumes:
      - database:/app/data
      - staticfiles:/app/staticfiles
      - ./backups:/app/backups
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/srv/staticfiles:ro
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/acme:/var/www/certbot:ro
    restart: unless-stopped

  nginx-bootstrap:
    image: nginx:stable-alpine
    profiles: [bootstrap]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/acme:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    profiles: [certbot]
    volumes:
      - ./deploy/letsencrypt:/etc/letsencrypt
      - ./deploy/acme:/var/www/certbot

volumes:
  database:
  staticfiles:
