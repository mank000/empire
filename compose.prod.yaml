x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  volume-permissions:
    build:
      context: .
      target: prod
    user: "0:0"
    volumes:
      - database:/app/data
      - staticfiles:/app/staticfiles
      - media:/app/media
      - ./backups:/app/backups
    command: ["sh", "-c", "chown -R 10001:10001 /app/data /app/staticfiles /app/media /app/backups"]
    restart: "no"
    logging: *bounded-logging

  web:
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - database:/app/data
      - staticfiles:/app/staticfiles
      - media:/app/media
      - ./backups:/app/backups
    expose:
      - "8000"
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped
    logging: *bounded-logging

  backup:
    build:
      context: .
      target: prod
    depends_on:
      - web
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
    volumes:
      - database:/app/data
      - ./backups:/app/backups
    command: ["sh", "-c", "until test -f /app/data/db.sqlite3; do sleep 5; done; while true; do if python deploy/backup_database.py; then sleep 86400; else echo 'Ошибка резервного копирования; повтор через 5 минут' >&2; sleep 300; fi; done"]
    restart: unless-stopped
    logging: *bounded-logging

  worker:
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - database:/app/data
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["celery", "-A", "montage_empire", "worker", "--loglevel=INFO", "--concurrency=1"]
    restart: unless-stopped
    logging: *bounded-logging

  dispatcher:
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["python", "manage.py", "dispatch_notifications"]
    restart: unless-stopped
    logging: *bounded-logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *bounded-logging

  nginx:
    image: nginx:stable-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/srv/staticfiles:ro
      - media:/srv/media:ro
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/acme:/var/www/certbot:ro
    restart: unless-stopped
    logging: *bounded-logging

  nginx-bootstrap:
    image: nginx:stable-alpine
    profiles: [bootstrap]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/acme:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    profiles: [certbot]
    volumes:
      - ./deploy/letsencrypt:/etc/letsencrypt
      - ./deploy/acme:/var/www/certbot

volumes:
  database:
  staticfiles:
  media:
  redis_data:
