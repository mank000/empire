services:
  web:
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /app/data/db.sqlite3
    volumes:
      - database:/app/data
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/srv/staticfiles:ro
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  database:
  staticfiles:
