services:
  web:
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - database:/app/data
      - staticfiles:/app/staticfiles
      - media:/app/media
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - database:/app/data
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["celery", "-A", "mantage_empire", "worker", "--loglevel=INFO", "--concurrency=1"]
    restart: unless-stopped

  beat:
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["celery", "-A", "mantage_empire", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/srv/staticfiles:ro
      - media:/srv/media:ro
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/acme:/var/www/certbot:ro
    restart: unless-stopped

  nginx-bootstrap:
    image: nginx:stable-alpine
    profiles: [bootstrap]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/acme:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    profiles: [certbot]
    volumes:
      - ./deploy/letsencrypt:/etc/letsencrypt
      - ./deploy/acme:/var/www/certbot

volumes:
  database:
  staticfiles:
  media:
  redis_data:
