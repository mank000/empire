services:
  web:
    build:
      context: .
      target: dev
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-}
    volumes:
      - .:/app
      - dev_database:/app/data
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: .
      target: dev
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-}
    volumes:
      - .:/app
      - dev_database:/app/data
    depends_on:
      - web
      - redis
    command: ["celery", "-A", "mantage_empire", "worker", "--loglevel=INFO", "--concurrency=1"]

  beat:
    build:
      context: .
      target: dev
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - dev_database:/app/data
    depends_on:
      - web
      - redis
    command: ["celery", "-A", "mantage_empire", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data

volumes:
  dev_database:
  redis_data:
