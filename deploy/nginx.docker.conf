limit_req_zone $binary_remote_addr zone=ticket_requests:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=admin_logins:10m rate=5r/m;
server_tokens off;

server {
    listen 80 default_server;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css application/javascript image/svg+xml application/json;

    ssl_certificate /etc/letsencrypt/live/empire/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/empire/privkey.pem;

    location /static/ {
        alias /srv/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/media/;
    }

    location = /api/tickets/ {
        limit_req zone=ticket_requests burst=2 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://web:8000;
    }

    location = /admin/login/ {
        limit_req zone=admin_logins burst=3 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://web:8000;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://web:8000;
    }
}
