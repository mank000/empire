{% load static %}
<section class="why-us" id="about">
    <div class="why-us-content section-content">
        <h2 class="redline">
            03
            <svg width="24"
                 height="2"
                 viewBox="0 0 24 2"
                 fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="2" fill="#E02D37" />
            </svg>
            ПОЧЕМУ МЫ
        </h2>
        <div class="why-us-timeline">
            <div class="first-line">
                <span>Эти цифры объясняют</span>
                <img src="{% static 'img/first-timeline.jpg' %}" alt="" width="294" height="196" loading="lazy" decoding="async">
                <span>почему нас зовут</span>
                <img src="{% static 'img/second-timeline.jpg' %}" alt="" width="294" height="196" loading="lazy" decoding="async">
            </div>
            <div class="second-line">
                <img src="{% static 'img/third-timeline.jpg' %}" alt="" width="294" height="196" loading="lazy" decoding="async">
                <span>на сложные объекты</span>
            </div>
        </div>
        <div class="why-us-achievements">
            <div class="achievements">
                <div>
                    <div class="achievement-number"><strong>12</strong> лет</div>
                    <p>НА РЫНКЕ ПРИМОРЬЯ</p>
                    <span>работаем с 2013 года</span>
                </div>
                <div>
                    <div class="achievement-number"><strong>450</strong>  +</div>
                    <p>Объектов сдано</p>
                    <span>от квартиры до сети филиалов</span>
                </div>
                <div>
                    <div class="achievement-number"><strong>98</strong>  %</div>
                    <p>Приёмка с первого раза</p>
                    <span>включая государственные объекты</span>
                </div>
            </div>
            <a href="#request-modal" class="red-button" data-request-modal-open>
                <span class="red-button-text">Оставить заявку</span>
                <span class="red-button-arrow">
                    <svg width="24"
                         height="24"
                         viewBox="0 0 24 24"
                         fill="none"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M3.5 12H20.33M14.4297 5.92969L20.4997 11.9997L14.4297 18.0697" stroke-width="2" stroke-miterlimit="10" stroke-linejoin="bevel" stroke="white" />
                    </svg>
                </span>
            </a>
        </div>
    </div>
</section>
