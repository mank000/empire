<section class="faq">
    <div class="faq-content section-content">
        <p class="redline">
            07
            <svg width="24"
                 height="2"
                 viewBox="0 0 24 2"
                 fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="2" fill="#E02D37" />
            </svg>
            FAQ
        </p>
        <div class="faq-header">
            <h2 class="section-title">Частые вопросы</h2>
        </div>
        <div class="faq-grid">
            <div class="faq-column">
                {% for faq in faq_left %}
                    {% include "includes/faq-item.html" with open_first=forloop.first %}
                {% endfor %}
            </div>
            <div class="faq-column">
                {% for faq in faq_right %}
                    {% include "includes/faq-item.html" %}
                {% endfor %}
            </div>
        </div>
    </div>
</section>
