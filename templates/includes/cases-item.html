{% load static %}
<article class="cases-item">
    <div class="cases-preview-corners">
        <div class="cases-preview-gradient">
            <div class="cases-preview">
                <img src="{% static image %}" alt="">
            </div>
        </div>
    </div>
    <div class="cases-item-content">
        <div class="cases-item-header">
            <div class="cases-tags">
                <span class="cases-tag"><span>Видеонаблюдение</span></span>
                <span class="cases-tag"><span>СКУД</span></span>
            </div>
            <span class="cases-status">Объект сдан · на обслуживании</span>
        </div>
        <div class="cases-item-details">
            <div class="cases-item-description">
                <h3>Бизнес-центр Сбербанка</h3>
                <p>Комплексная система безопасности класса А: 48 IP-камер с видеоаналитикой, СКУД на 6 входных групп и интеграция с постом охраны.</p>
            </div>
            <div class="cases-item-footer">
                <div><strong>48</strong><span>IP-камер</span></div>
                <div><strong>14<small> дн</small></strong><span>Срок сдачи</span></div>
                <div><strong>6</strong><span>Точек СКУД</span></div>
            </div>
        </div>
    </div>
</article>
