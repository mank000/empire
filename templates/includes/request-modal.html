{% load static %}
<dialog class="request-modal" id="request-modal" aria-labelledby="request-modal-title">
    <button class="request-modal-close" type="button" aria-label="Закрыть форму">×</button>
    <div class="request-modal-card">
        <div class="make-ticket-panel">
            <div class="make-ticket-intro">
                <h2 id="request-modal-title">Обсудим ваш проект?</h2>
                <p>Опишите задачу — свяжемся, уточним детали <br>и согласуем время осмотра объекта.</p>
                <div class="make-ticket-benefits">
                    <span>Гарантия 1 год на монтаж</span>
                    <span>Любые формы оплаты</span>
                </div>
            </div>
            {% include "includes/contact-form.html" with prefix="request-modal" %}
        </div>
        <div class="make-ticket-photo">
            <img src="{% static 'img/lastpic.jpg' %}" width="1024" height="1024" alt="Инженер проверяет электрический щит" loading="lazy" decoding="async">
            <div class="make-ticket-viewfinder" aria-hidden="true"></div>
            <div class="make-ticket-status"><span></span>{{ site_settings.work_hours }}</div>
            <svg class="make-ticket-battery" width="20" height="10" viewBox="0 0 20 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0.5 0.5H17.5V9.5H0.5V0.5Z" stroke="white" />
                <path d="M2 2H5L4 8H2V2Z" fill="white" />
                <path d="M6 2H9L8 8H5L6 2Z" fill="white" />
                <path d="M10 2H13L12 8H9L10 2Z" fill="white" />
                <path d="M18 2.5H20V7.5H18V2.5Z" fill="white" />
            </svg>
        </div>
    </div>
</dialog>
