{% load static %}
<dialog class="request-success-modal" id="request-success-modal" aria-labelledby="request-success-title">
    <button class="request-modal-close" type="button" aria-label="Закрыть сообщение">×</button>
    <div class="request-success-card">
        <img class="request-success-image" src="{% static 'img/request-success.png' %}" width="668" height="596" alt="" aria-hidden="true" loading="lazy" decoding="async">
        <div class="request-success-content">
            <h2 id="request-success-title">Заявка отправлена</h2>
            <p>Мы свяжемся с вами в ближайшее время<br>для уточнения всех деталей проекта.</p>
            <button class="red-button request-success-home" type="button">
                <span class="red-button-text">На главную</span>
                <span class="red-button-arrow" aria-hidden="true">
                    {% include "includes/icons/arrow-right.html" %}
                </span>
            </button>
        </div>
    </div>
</dialog>
