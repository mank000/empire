{% load static %}
<section class="sponsors-string" id="customers" aria-label="Наши партнёры">
    <div class="sponsors-track">
        {% for group in "123456" %}
            <div class="sponsors-group" aria-hidden="true">
                {% for logo in customer_logos %}
                    {% if logo.image %}<img src="{{ logo.image.url }}" alt="{{ logo.name }}" width="{{ logo.image_dimensions.0 }}" height="{{ logo.image_dimensions.1 }}" loading="lazy" decoding="async">{% else %}<img src="{% static logo.initial_image %}" alt="{{ logo.name }}" width="{{ logo.image_dimensions.0 }}" height="{{ logo.image_dimensions.1 }}" loading="lazy" decoding="async">{% endif %}
                {% endfor %}
            </div>
        {% endfor %}
    </div>
</section>
