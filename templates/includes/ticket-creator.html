<section class="ticket-section">
    <div class="ticket-creator">
        <div class="ticket-content">
            <div class="ticket-header">
                <h2>Не нашли свою задачу?</h2>
                <div class="ticket-phone header-phone">
                    <a href="tel:{{ site_settings.phone_href }}">{{ site_settings.phone }}</a>
                    <span>{{ site_settings.work_hours }}</span>
                </div>
            </div>
            <p class="ticket-under-problem">Оставьте заявку и мы подберём наилучшее решение под вашу индивидуальную задачу</p>
            <div class="ticket-footer">
                <div class="advantages">
                    <div>
                        <span>ВЫЕЗД БЕСПЛАТНО</span>
                    </div>
                    <div>
                        <span>ПРОЕКТ ЗА 3 ДНЯ</span>
                    </div>
                    <div>
                        <span>ГАРАНТИЯ 3 ГОДА</span>
                    </div>
                </div>
                <div class="ticket-creation-button">
                    <a href="#request-modal" class="red-button red-button--light" data-request-modal-open>
                        <span class="red-button-text">Оставить заявку</span>
                        <span class="red-button-arrow">
                            {% include "includes/icons/arrow-right.html" with color="#0E1014" %}
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
